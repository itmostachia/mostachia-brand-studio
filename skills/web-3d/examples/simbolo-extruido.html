<!doctype html>
<!-- Snippet 1 + 3 de web-3d: símbolo de marca extruido (Shape → ExtrudeGeometry), materiales de la paleta,
     RoomEnvironment para reflejos sin HDRI externo, fondo con shader de ruido. Marca ficticia. -->
<html lang="es"><head><meta charset="utf-8">
<style>html,body{margin:0;height:100%;background:#10222B;overflow:hidden}canvas{display:block}</style>
<script type="importmap">{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const PALETA = { tinta:'#10222B', papel:'#EFE7DA', acento:'#E4572E', suave:'#7FA7A3' }; // ← de tokens.json

const renderer = new THREE.WebGLRenderer({ antialias:true, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));           // DPR clamp
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(32, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 0, 6.6);

// ---------- fondo: plano full-screen con shader (gradiente + ruido + viñeta) ----------
const fondo = new THREE.Mesh(new THREE.PlaneGeometry(2,2), new THREE.ShaderMaterial({
  depthWrite:false, depthTest:false,
  uniforms:{ uA:{value:new THREE.Color(PALETA.tinta)}, uB:{value:new THREE.Color(PALETA.suave)}, uC:{value:new THREE.Color(PALETA.acento)}, uT:{value:0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }`,
  fragmentShader:`
    varying vec2 vUv; uniform vec3 uA,uB,uC; uniform float uT;
    float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
    float n(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f);
      return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }
    float fbm(vec2 p){ float v=0.,a=.5; for(int i=0;i<5;i++){ v+=a*n(p); p*=2.; a*=.5; } return v; }
    void main(){
      vec2 uv=vUv; float f=fbm(uv*3.+uT*.05);
      vec3 col=mix(uA, uB*.55, smoothstep(.35,.95,f*uv.y*1.4));
      col=mix(col, uC, smoothstep(.62,.95,fbm(uv*2.2-vec2(.3,uT*.03)))*.35*(1.-uv.y));
      col+=uB*.35*smoothstep(.55,0.,length((uv-vec2(.5,.47))*vec2(1.5,1.)));  // halo de acento detrás del símbolo
      col*=1.-.55*length(uv-.5);                       // viñeta
      col+=(h(uv*800.)-.5)*.035;                        // grano
      gl_FragColor=vec4(col,1.);
    }`
}));
fondo.renderOrder = -1; fondo.frustumCulled = false;
scene.add(fondo);

// ---------- símbolo: anillo + aguja en dos mitades (mismas coordenadas que el SVG del kit, viewBox 120) ----------
function forma(){ // SVG y↓ → Three y↑ : invertimos y, centramos en (60,60), escala 1/40
  const k = 1/40, P = (x,y)=>new THREE.Vector2((x-60)*k, -(y-60)*k);
  const anillo = new THREE.Shape().absarc(0,0,55*k,0,Math.PI*2,false);
  anillo.holes.push(new THREE.Path().absarc(0,0,44*k,0,Math.PI*2,true));
  const norte = new THREE.Shape([P(60,22),P(73,54),P(47,54)]);
  const sur = new THREE.Shape([P(47,58),P(73,58),P(60,98)]);
  sur.holes.push(new THREE.Path([P(53.2,62.5),P(60,83),P(66.8,62.5)]));
  return { anillo, norte, sur };
}
const f = forma();
const ext = { depth:.32, bevelEnabled:true, bevelThickness:.05, bevelSize:.035, bevelSegments:6, curveSegments:96 };
const geo = s => { const g=new THREE.ExtrudeGeometry(s,ext); g.center(); return g; };

const matPapel  = new THREE.MeshPhysicalMaterial({ color:PALETA.papel, roughness:.38, metalness:0, clearcoat:.6, clearcoatRoughness:.25 });
const matAcento = new THREE.MeshPhysicalMaterial({ color:PALETA.acento, roughness:.3, metalness:.1, clearcoat:1 });

const simbolo = new THREE.Group();
const anillo = new THREE.Mesh(geo(f.anillo), matPapel);
const norte  = new THREE.Mesh(new THREE.ExtrudeGeometry(f.norte, ext), matAcento);
const sur    = new THREE.Mesh(new THREE.ExtrudeGeometry(f.sur, ext), matPapel);
[norte, sur].forEach(m => m.position.z = -ext.depth/2);   // las mitades no se centran solas: alinear en z
norte.position.z += .12;                                  // la aguja flota un poco delante del anillo
simbolo.add(anillo, norte, sur);
simbolo.rotation.set(-.18, .52, .06);
scene.add(simbolo);

// luz clave cálida + contra fría (rim) para despegar el contorno del fondo
const key = new THREE.DirectionalLight('#fff2e2', 2.2); key.position.set(3,4,5); scene.add(key);
const rim = new THREE.DirectionalLight(PALETA.suave, 6); rim.position.set(-5,2,-1.5); scene.add(rim);

const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clock = new THREE.Clock();
function frame(){
  const t = clock.getElapsedTime();
  fondo.material.uniforms.uT.value = t;
  if(!reducido){ simbolo.rotation.y = .52 + Math.sin(t*.5)*.25; simbolo.position.y = Math.sin(t*.8)*.06; }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
setTimeout(() => { window.__listo = true; }, 1500);   // señal para el render headless
</script></body></html>
